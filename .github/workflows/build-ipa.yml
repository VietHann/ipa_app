name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download local TTS model
        run: ./scripts/fetch_model.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project VietVoice.xcodeproj -scheme VietVoice

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project VietVoice.xcodeproj \
            -scheme VietVoice \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify bundled TTS model
        run: |
          APP="build/Build/Products/Release-iphoneos/VietVoice.app"
          for file in \
            duration_predictor.int8.onnx \
            text_encoder.int8.onnx \
            vector_estimator.int8.onnx \
            vocoder.int8.onnx \
            tts.json \
            unicode_indexer.bin \
            voice.bin; do
            if [[ ! -f "$APP/$file" && ! -f "$APP/Supertonic/$file" ]]; then
              echo "ERROR: Missing bundled model file: $file"
              find "$APP" -maxdepth 2 -type f | sort
              exit 1
            fi
          done
          echo "All TTS model files are bundled."
          du -sh "$APP"

      - name: Package IPA
        run: |
          rm -rf Payload VietVoice-unsigned.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/VietVoice.app Payload/
          zip -qry VietVoice-unsigned.ipa Payload
          ls -lh VietVoice-unsigned.ipa

          SIZE=$(stat -f%z VietVoice-unsigned.ipa)
          if [[ "$SIZE" -lt 30000000 ]]; then
            echo "ERROR: IPA is unexpectedly small ($SIZE bytes). Model was likely not bundled."
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VietVoice-2.0-unsigned-ipa
          path: VietVoice-unsigned.ipa
