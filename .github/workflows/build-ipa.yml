name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download local TTS model
        run: ./scripts/fetch_model.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project VietVoice.xcodeproj -scheme VietVoice

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project VietVoice.xcodeproj \
            -scheme VietVoice \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/VietVoice.app Payload/
          zip -qry VietVoice-unsigned.ipa Payload
          ls -lh VietVoice-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VietVoice-unsigned-ipa
          path: VietVoice-unsigned.ipa
