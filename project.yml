name: VietVoice
options:
  bundleIdPrefix: xyz.noxhub
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
targets:
  VietVoice:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VietVoice
        excludes:
          - Resources
          - Assets.xcassets
      - path: VietVoice/Assets.xcassets
        buildPhase: resources
      - path: VietVoice/Resources/Supertonic/duration_predictor.int8.onnx
        buildPhase: resources
      - path: VietVoice/Resources/Supertonic/text_encoder.int8.onnx
        buildPhase: resources
      - path: VietVoice/Resources/Supertonic/vector_estimator.int8.onnx
        buildPhase: resources
      - path: VietVoice/Resources/Supertonic/vocoder.int8.onnx
        buildPhase: resources
      - path: VietVoice/Resources/Supertonic/tts.json
        buildPhase: resources
      - path: VietVoice/Resources/Supertonic/unicode_indexer.bin
        buildPhase: resources
      - path: VietVoice/Resources/Supertonic/voice.bin
        buildPhase: resources
    info:
      path: VietVoice/Info.plist
      properties:
        CFBundleDisplayName: VietVoice
        CFBundleShortVersionString: "2.1.0"
        CFBundleVersion: "11"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.noxhub.vietvoice
        PRODUCT_NAME: VietVoice
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
schemes:
  VietVoice:
    build:
      targets:
        VietVoice: all
    run:
      config: Debug
    archive:
      config: Release
